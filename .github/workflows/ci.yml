name: CI

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x server/backend/mvnw

      - name: Run backend tests
        working-directory: server/backend
        run: ./mvnw --batch-mode --errors verify

  backend-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riot_test
          POSTGRES_USER: riot_user
          POSTGRES_PASSWORD: riot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_POSTGRES_INTEGRATION_TESTS: true
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/riot_test
      POSTGRES_TEST_USERNAME: riot_user
      POSTGRES_TEST_PASSWORD: riot_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x server/backend/mvnw

      - name: Run backend integration tests
        working-directory: server/backend
        run: ./mvnw --batch-mode --errors verify

  docker-builds:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t riot-po-backend-ci:${{ github.sha }} server/backend

      - name: Build frontend Docker image
        run: docker build -t riot-po-frontend-ci:${{ github.sha }} server/frontend
