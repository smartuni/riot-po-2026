name: CI

on:
  workflow_dispatch:
    inputs:
      run_hardware_tests:
        description: Run firmware hardware tests on the self-hosted HIL runner
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:

jobs:
  discover-firmware-hardware-tests:
    runs-on: ubuntu-latest

    outputs:
      tests: ${{ steps.discover.outputs.tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover firmware hardware tests
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          tests = []
          for test_dir in sorted(pathlib.Path("nodes/firmware/tests").glob("test_*")):
              if not test_dir.is_dir():
                  continue

              board = ""
              makefile = test_dir / "Makefile"
              if makefile.exists():
                  for line in makefile.read_text(encoding="utf-8").splitlines():
                      match = re.match(r"\s*BOARD\s*\?=\s*([^\s#]+)", line)
                      if match:
                          board = match.group(1)
                          break

              if board and board != "native":
                  tests.append({
                      "name": test_dir.name,
                      "path": test_dir.as_posix(),
                      "board": board,
                  })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tests={json.dumps(tests, separators=(',', ':'))}\n")
          PY

  firmware-hardware-tests:
    name: Firmware hardware test (${{ matrix.test.name }})
    needs:
      - discover-firmware-hardware-tests
    if: >-
      ${{
        needs.discover-firmware-hardware-tests.outputs.tests != '[]' &&
        (
          github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && inputs.run_hardware_tests == true)
        )
      }}
    runs-on:
      - self-hosted
      - linux
      - hil
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-firmware-hardware-tests.outputs.tests) }}

    env:
      RIOTBUILD_IMAGE: riot/riotbuild:2025.07

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify HIL runner prerequisites
        shell: bash
        run: |
          set -euo pipefail

          test -e /dev/ttyUSB0
          test -S /var/run/docker.sock
          docker version

      - name: Run hardware test
        shell: bash
        env:
          TEST_PATH: ${{ matrix.test.path }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/riot-home"
          
          chmod +x tools/board_helper

          docker_args=(
            --rm
            --privileged
            --device /dev/ttyUSB0:/dev/ttyUSB0
            --volume /var/run/docker.sock:/var/run/docker.sock
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"
            --volume "$RUNNER_TEMP:$RUNNER_TEMP"
            --workdir "$GITHUB_WORKSPACE/$TEST_PATH"
            --env CI=true
            --env HOME="$RUNNER_TEMP/riot-home"
            --env USER=root
            --user root
            --group-add "$(stat -c '%g' /var/run/docker.sock)"
            --group-add "$(stat -c '%g' /dev/ttyUSB0)"
          )

          BOARD_HELPER_PATH="$GITHUB_WORKSPACE/tools/board_helper"

          docker run "${docker_args[@]}" riot/riotbuild:latest bash -c "
            make all && \
            make BOARD_HELPER=$BOARD_HELPER_PATH flash && \
            make test
          "

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x server/backend/mvnw

      - name: Run backend tests
        working-directory: server/backend
        run: ./mvnw --batch-mode --errors verify

  backend-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riot_test
          POSTGRES_USER: riot_user
          POSTGRES_PASSWORD: riot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_POSTGRES_INTEGRATION_TESTS: true
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/riot_test
      POSTGRES_TEST_USERNAME: riot_user
      POSTGRES_TEST_PASSWORD: riot_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x server/backend/mvnw

      - name: Run backend integration tests
        working-directory: server/backend
        run: ./mvnw --batch-mode --errors verify

  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: server/frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: server/frontend
        # Playwright's webServer config brings up the dockerised backend
        # (e2e profile + seed) and the Vite dev server, then waits for both.
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: server/frontend/playwright-report
          retention-days: 7

  docker-builds:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t riot-po-backend-ci:${{ github.sha }} server/backend

      - name: Build frontend Docker image
        run: docker build -t riot-po-frontend-ci:${{ github.sha }} server/frontend

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs:
      - docker-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose -f server/docker-compose.yml build

      - name: Start full stack
        run: |
          docker compose -f server/docker-compose.yml up -d
          echo "Waiting for backend health check..."
          timeout 120 sh -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
          echo "Backend is healthy"

      - name: Smoke test frontend
        run: |
          echo "Waiting for frontend..."
          timeout 60 sh -c 'until curl -sf -o /dev/null http://localhost:3000; do sleep 3; done'
          echo "Frontend is serving"

      - name: Smoke test API
        run: |
          # Verify backend responds with expected content
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          echo "API health check passed"

      - name: Tear down
        if: always()
        run: docker compose -f server/docker-compose.yml down -v

