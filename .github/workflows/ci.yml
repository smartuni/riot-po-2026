name: CI

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x server/backend/mvnw

      - name: Run backend tests
        working-directory: server/backend
        run: ./mvnw --batch-mode --errors verify

  docker-builds:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t riot-po-backend-ci:${{ github.sha }} server/backend

      - name: Build frontend Docker image
        run: docker build -t riot-po-frontend-ci:${{ github.sha }} server/frontend
