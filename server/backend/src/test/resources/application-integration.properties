spring.datasource.url=${POSTGRES_TEST_URL:jdbc:postgresql://localhost:5432/riot_test}
spring.datasource.username=${POSTGRES_TEST_USERNAME:riot_user}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:riot_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

logging.level.root=WARN
